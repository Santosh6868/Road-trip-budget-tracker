<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roadtrip Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <header>
    <div class="header-content">
      <div class="header-title">
        <svg class="header-car-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 17a2 2 0 100 4 2 2 0 000-4ptm0 0H6a2 2 0 01-2-2V9a2 2 0 012-2h12a2 2 0 012 2v6a2 2 0 01-2 2h-2m-4 0a2 2 0 100 4 2 2 0 000-4m-6 0h6"></path>
        </svg>
        <h1>Roadtrip Budget</h1>
      </div>
      <div class="header-actions">
        <div class="people-badge" id="btn-people-modal">
          <span>👥</span> <span id="people-count-label">4 People</span>
        </div>
      </div>
    </div>
  </header>

  <main>
    <!-- Total Summary Card -->
    <section class="card bg-glass">
      <h2>Overall Spending</h2>
      <div class="total-display">
        <span id="total-amount">₹0.00</span>
        <p>Total Group Expenses</p>
      </div>
      <div class="chart-container">
        <canvas id="categoryChart"></canvas>
      </div>
    </section>

    <!-- NEW: Individual Spending Breakdown & Top Spender -->
    <section class="card bg-glass">
      <h2>Individual Spending</h2>
      <div class="space-y" id="individual-breakdown-list">
        <!-- Rendered dynamically via JS -->
      </div>
      <div class="split-target" style="margin-top: 12px; margin-bottom: 0;">
        <span>🏆 TOP SPENDER</span>
        <strong id="top-spender-name">--</strong>
      </div>
    </section>

    <!-- Expense Entry Form -->
    <section class="card bg-glass">
      <h2>Add New Expense</h2>
      <form id="expense-form">
        <div class="form-group">
          <label>Payer</label>
          <div class="chips-grid" id="payer-chips">
            <button type="button" class="chip active" data-value="Sai">Sai</button>
            <button type="button" class="chip" data-value="Santosh">Santosh</button>
            <button type="button" class="chip" data-value="Siva">Siva</button>
            <button type="button" class="chip" data-value="Srinu">Srinu</button>
          </div>
        </div>

        <div class="form-group">
          <label for="amount">Amount (₹)</label>
          <input type="number" id="amount" placeholder="0.00" step="0.01" required>
        </div>

        <div class="form-group">
          <label for="category">Category</label>
          <select id="category" required>
            <option value="Fuel">Fuel</option>
            <option value="Food">Food</option>
            <option value="Stay">Stay</option>
            <option value="Toll">Toll</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label for="description">Description (Optional)</label>
          <input type="text" id="description" placeholder="e.g., Petrol at HP bunk">
        </div>

        <button type="submit" class="btn btn-primary w-full">Add Expense</button>
      </form>
    </section>

    <!-- Balance / Settlement Summary -->
    <section class="card bg-glass">
      <div class="card-header-flex">
        <h2>Balances & Settlement</h2>
      </div>
      <div class="split-target">
        <span>Target Per Person Share</span>
        <strong id="per-person-share">₹0.00</strong>
      </div>
      <div class="space-y" id="balances-list">
        <!-- Rendered dynamically -->
      </div>
    </section>

    <!-- Expense History Log -->
    <section class="card bg-glass">
      <h2>Expense History</h2>
      <div class="scrollable-history space-y" id="history-list">
        <!-- Rendered dynamically -->
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
